<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chunguza</title>
<link rel="stylesheet" href="/ds.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="logo-mark" style="width:24px;height:24px;">
        <span class="mark" data-logo-fallback>C</span>
        <canvas data-chunguza-logo="mark" aria-hidden="true"></canvas>
      </span>
      <span class="name">chunguza</span>
    </div>
    <select class="input ws-switch" id="wsSwitch" aria-label="Workspace"></select>
    <span class="tag tag-outline" id="wsKind" hidden></span>
    <div class="spacer"></div>
    <div class="bell">
      <button class="btn btn-secondary" id="bellBtn" aria-haspopup="true" aria-expanded="false" title="Notifications">🔔<span class="count" id="bellCount" hidden>0</span></button>
      <div class="notif-panel" id="notifPanel" hidden></div>
    </div>
    <span class="tag tag-neutral" id="userTag"></span>
    <button class="btn btn-secondary" id="logoutBtn">Log out</button>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
  <main class="main" id="view"><p class="empty">Loading…</p></main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Lead details"></aside>

<div class="dialog-backdrop" id="dialogBackdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-title" id="dialogTitle"></div>
    <div class="dialog-body" id="dialogBody"></div>
    <div class="dialog-actions" id="dialogActions"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="importmap">
{ "imports": {
  "three": "/js/vendor/three/three.module.js",
  "three/addons/": "/js/vendor/three/addons/"
} }
</script>
<script type="module" src="/js/logoViewer.js"></script>
<script type="module" src="/js/app/main.js"></script>
</body>
</html>
